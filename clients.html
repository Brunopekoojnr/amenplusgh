<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Amen+ | Clients Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brown: #5C3A2D;
            --gold: #D4AF37;
            --cream: #FDF6F0;
            --white: #fff;
            --shadow: 0 4px 20px rgba(92,58,45,0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            min-height: 100vh;
        }

        /* ---- SIDEBAR ---- */
        .sidebar {
            width: 240px;
            background: var(--brown);
            min-height: 100vh;
            position: fixed;
            left: 0; top: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .sidebar-logo {
            padding: 25px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-logo span {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: white;
            font-weight: 700;
        }
        .sidebar-logo .plus { color: var(--gold); }
        .sidebar-nav { padding: 20px 0; flex: 1; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(212,175,55,0.15);
            color: var(--gold);
            border-left: 3px solid var(--gold);
        }
        .nav-item i { width: 20px; text-align: center; }
        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn {
            display: block;
            text-align: center;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { color: var(--gold); }

        /* ---- MAIN ---- */
        .main {
            margin-left: 240px;
            padding: 30px;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--brown);
        }
        .page-header p { color: #888; font-size: 0.9rem; margin-top: 3px; }

        /* ---- STATS ---- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--white);
            border-radius: 16px;
            padding: 22px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--gold);
        }
        .stat-card .label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--brown);
            margin: 5px 0;
        }
        .stat-card .change {
            font-size: 0.8rem;
            color: #28a745;
        }

        /* ---- SEARCH & FILTER ---- */
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-box {
            flex: 1;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 10px;
            padding: 0 15px;
            box-shadow: var(--shadow);
            gap: 10px;
        }
        .search-box i { color: #aaa; }
        .search-box input {
            border: none;
            outline: none;
            padding: 12px 0;
            width: 100%;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }
        .export-btn {
            background: var(--brown);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        .export-btn:hover { background: var(--gold); color: var(--brown); }

        /* ---- TABLE ---- */
        .table-card {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .table-card table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-card th {
            background: var(--brown);
            color: white;
            padding: 14px 18px;
            text-align: left;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-card td {
            padding: 14px 18px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 0.9rem;
            color: #444;
        }
        .table-card tr:hover td { background: #fffbf5; }
        .table-card tr:last-child td { border-bottom: none; }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brown), var(--gold));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .customer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .customer-name { font-weight: 600; color: var(--brown); }
        .customer-email { font-size: 0.8rem; color: #aaa; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-gold { background: rgba(212,175,55,0.15); color: #b8960c; }
        .badge-brown { background: rgba(92,58,45,0.1); color: var(--brown); }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; display: block; }
        .loading { text-align: center; padding: 40px; color: #aaa; }
        .error-msg { 
            background: #fff3f3; 
            border: 1px solid #ffa0a0; 
            color: #c00;
            padding: 15px 20px;
            border-radius: 10px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>AMEN<span class="plus">+</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin.html" class="nav-item">
                <i class="fas fa-box"></i> Orders
            </a>
            <a href="clients.html" class="nav-item active">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="shop.html" class="nav-item">
                <i class="fas fa-store"></i> Shop
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Site</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="page-header">
            <div>
                <h1>Clients</h1>
                <p>All registered customers and their purchase history</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Clients</div>
                <div class="value" id="totalClients">–</div>
                <div class="change">All time</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Revenue</div>
                <div class="value" id="totalRevenue">–</div>
                <div class="change">From all clients</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg. Order Value</div>
                <div class="value" id="avgOrderValue">–</div>
                <div class="change">Per client</div>
            </div>
            <div class="stat-card">
                <div class="label">Repeat Clients</div>
                <div class="value" id="repeatClients">–</div>
                <div class="change">2+ orders</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, phone, or email..." oninput="filterClients()">
            </div>
            <button class="export-btn" onclick="exportCSV()">
                <i class="fas fa-download"></i> Export CSV
            </button>
        </div>

        <!-- Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Orders</th>
                        <th>Total Spent</th>
                        <th>First Purchase</th>
                    </tr>
                </thead>
                <tbody id="clientsBody">
                    <tr><td colspan="6" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading clients...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = 'https://amenplus-backend.onrender.com/api';
        const ADMIN_KEY = localStorage.getItem('amenAdminKey') || promptAdminKey();

        function promptAdminKey() {
            const key = prompt('🔐 Enter Admin Key to access client data:');
            if (key) localStorage.setItem('amenAdminKey', key);
            return key;
        }

        let allClients = [];

        async function loadClients() {
            try {
                const [clientsRes, statsRes] = await Promise.all([
                    fetch(`${API_URL}/customers`, { headers: { 'x-admin-key': ADMIN_KEY } }),
                    fetch(`${API_URL}/dashboard/stats`, { headers: { 'x-admin-key': ADMIN_KEY } })
                ]);

                if (clientsRes.status === 401) {
                    document.getElementById('clientsBody').innerHTML = `
                        <tr><td colspan="6" class="error-msg">❌ Invalid Admin Key. <a href="#" onclick="localStorage.removeItem('amenAdminKey'); location.reload()">Try again</a></td></tr>
                    `;
                    return;
                }

                const clientsData = await clientsRes.json();
                const statsData = await statsRes.json();

                if (statsData.success) {
                    const s = statsData.stats;
                    document.getElementById('totalClients').textContent = s.totalCustomers;
                    document.getElementById('totalRevenue').textContent = `₵${(s.totalRevenue || 0).toLocaleString()}`;
                    document.getElementById('avgOrderValue').textContent = s.totalCustomers
                        ? `₵${Math.round(s.totalRevenue / s.totalCustomers).toLocaleString()}`
                        : '₵0';
                    document.getElementById('repeatClients').textContent = s.totalCustomers;
                }

                if (clientsData.success) {
                    allClients = clientsData.customers;
                    renderClients(allClients);
                }
            } catch (err) {
                document.getElementById('clientsBody').innerHTML = `
                    <tr><td colspan="6" class="error-msg">
                        ⚠️ Cannot connect to backend server.<br>
                        Make sure Render backend is deployed and running at:<br>
                        <strong>${API_URL}</strong>
                    </td></tr>
                `;
            }
        }

        function renderClients(clients) {
            const tbody = document.getElementById('clientsBody');
            if (!clients || clients.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="6">
                        <div class="empty-state">
                            <i class="fas fa-users"></i>
                            No clients yet. Once customers complete purchases, they will appear here.
                        </div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = clients.map(c => {
                const initials = (c.name || 'U').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                const date = c.createdAt ? new Date(c.createdAt).toLocaleDateString('en-GB') : '—';
                const isRepeat = (c.totalOrders || 0) >= 2;
                return `
                    <tr>
                        <td>
                            <div class="customer-info">
                                <div class="avatar">${initials}</div>
                                <div>
                                    <div class="customer-name">${c.name || 'Unknown'}</div>
                                    ${isRepeat ? '<span class="badge badge-gold">Repeat</span>' : '<span class="badge badge-brown">New</span>'}
                                </div>
                            </div>
                        </td>
                        <td><i class="fas fa-phone" style="color:var(--gold);margin-right:6px;font-size:0.75rem;"></i>${c.phone || '—'}</td>
                        <td>${c.email || '—'}</td>
                        <td><strong>${c.totalOrders || 0}</strong></td>
                        <td><strong>₵${(c.totalSpent || 0).toLocaleString()}</strong></td>
                        <td>${date}</td>
                    </tr>
                `;
            }).join('');

            // Update repeat clients stat
            const repeatCount = clients.filter(c => (c.totalOrders || 0) >= 2).length;
            document.getElementById('repeatClients').textContent = repeatCount;
        }

        function filterClients() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allClients.filter(c =>
                (c.name || '').toLowerCase().includes(q) ||
                (c.phone || '').toLowerCase().includes(q) ||
                (c.email || '').toLowerCase().includes(q)
            );
            renderClients(filtered);
        }

        function exportCSV() {
            if (!allClients.length) { alert('No clients to export yet!'); return; }
            const headers = ['Name', 'Phone', 'Email', 'Total Orders', 'Total Spent (₵)', 'First Purchase'];
            const rows = allClients.map(c => [
                c.name || '', c.phone || '', c.email || '',
                c.totalOrders || 0, c.totalSpent || 0,
                c.createdAt ? new Date(c.createdAt).toLocaleDateString() : ''
            ]);
            const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `amenplus_clients_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        loadClients();
        setInterval(loadClients, 60000); // refresh every minute
    </script>
</body>
</html>
