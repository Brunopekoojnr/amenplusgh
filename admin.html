<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no">
    <title>Amen+ | Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FDF6F0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #5C3A2D;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border-left: 4px solid #D4AF37;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .stat-card h3 {
            font-size: 2rem;
            color: #5C3A2D;
        }
        .stat-card p {
            color: #666;
        }
        .orders-table {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #5C3A2D;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background: #FDF6F0;
        }
        .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-pending {
            background: #ffc107;
            color: #856404;
        }
        .status-confirmed {
            background: #28a745;
            color: white;
        }
        .status-shipped {
            background: #17a2b8;
            color: white;
        }
        .status-delivered {
            background: #6f42c1;
            color: white;
        }
        select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .refresh-btn {
            background: #5C3A2D;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .refresh-btn:hover {
            background: #D4AF37;
            color: #5C3A2D;
        }
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            th, td {
                padding: 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<!-- Mobile Menu -->
<div class="mobile-menu" id="mobile-menu">
    <button class="mobile-menu-close" onclick="closeMobileMenu()">
        <i class="fas fa-times"></i>
    </button>
    <a href="index.html" onclick="closeMobileMenu()">
        <i class="fas fa-home"></i> Home
    </a>
    <a href="shop.html" onclick="closeMobileMenu()">
        <i class="fas fa-store"></i> Shop
    </a>
    <a href="delivery.html" onclick="closeMobileMenu()">
        <i class="fas fa-truck"></i> Delivery
    </a>
    <a href="about.html" onclick="closeMobileMenu()">
        <i class="fas fa-book-open"></i> About
    </a>
    <a href="contact.html" onclick="closeMobileMenu()">
        <i class="fas fa-address-book"></i> Contact & Team
    </a>
    <a href="https://wa.me/233201686831" target="_blank">
        <i class="fab fa-whatsapp"></i> WhatsApp Us
    </a>
</div>

<body>
    <div class="container">
        <h1>📦 Amen+ Orders Dashboard</h1>
        <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh Orders</button>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="totalOrders">0</h3>
                <p>Total Orders</p>
            </div>
            <div class="stat-card">
                <h3 id="pendingOrders">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <h3 id="totalRevenue">₵0</h3>
                <p>Total Revenue</p>
            </div>
            <div class="stat-card">
                <h3 id="todayOrders">0</h3>
                <p>Today's Orders</p>
            </div>
        </div>
        
        <div class="orders-table">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Delivery</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr>
                        <td colspan="8" style="text-align: center;">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        
        async function loadOrders() {
            try {
                const response = await fetch(`${API_URL}/orders`);
                const data = await response.json();
                
                if (data.success) {
                    displayOrders(data.orders);
                    updateStats(data.orders);
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersBody').innerHTML = `
                    <tr><td colspan="8" style="text-align: center; color: red;">
                        ⚠️ Server not running. Please start server with: node server.js
                    </td></tr>
                `;
            }
        }
        
        function displayOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No orders yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = orders.map(order => {
                let itemsPreview = '';
                try {
                    const items = JSON.parse(order.items);
                    itemsPreview = items.map(item => `${item.name} (${item.size}) x${item.quantity}`).join(', ');
                } catch(e) {
                    itemsPreview = order.items;
                }
                
                const statusClass = `status status-${order.status}`;
                
                return `
                    <tr>
                        <td>${order.order_id}</td>
                        <td>${order.customer_name}</td>
                        <td>${order.customer_phone}</td>
                        <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${itemsPreview}</td>
                        <td>₵${order.total}</td>
                        <td>${order.delivery_area || order.delivery_zone}</td>
                        <td>
                            <select class="status-select" data-order-id="${order.order_id}" onchange="updateStatus('${order.order_id}', this.value)">
                                <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
                                <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                            </select>
                        </td>
                        <td>${new Date(order.created_at).toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
        }
        
        async function updateStatus(orderId, newStatus) {
            try {
                const response = await fetch(`${API_URL}/order/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await response.json();
                if (data.success) {
                    console.log('Status updated');
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }
        
        function updateStats(orders) {
            const total = orders.length;
            const pending = orders.filter(o => o.status === 'pending').length;
            const revenue = orders.reduce((sum, o) => sum + o.total, 0);
            
            const today = new Date().toDateString();
            const todayOrders = orders.filter(o => new Date(o.created_at).toDateString() === today).length;
            
            document.getElementById('totalOrders').textContent = total;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('totalRevenue').textContent = `₵${revenue.toLocaleString()}`;
            document.getElementById('todayOrders').textContent = todayOrders;
        }
        
        // Auto-refresh every 30 seconds
        loadOrders();
        setInterval(loadOrders, 30000);
    </script>
    <script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const hamburger = document.getElementById('hamburger');
    menu.classList.toggle('active');
    hamburger.classList.toggle('active');
    document.body.style.overflow = menu.classList.contains('active') ? 'hidden' : 'auto';
}

function closeMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const hamburger = document.getElementById('hamburger');
    menu.classList.remove('active');
    hamburger.classList.remove('active');
    document.body.style.overflow = 'auto';
}
</script>
</body>
</html>
