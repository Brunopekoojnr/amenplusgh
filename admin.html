<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>Amen+ | Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --brown: #5C3A2D;
            --gold: #D4AF37;
            --cream: #FDF6F0;
            --white: #fff;
            --shadow: 0 4px 20px rgba(92,58,45,0.1);
        }
        body { font-family: 'Inter', sans-serif; background: var(--cream); min-height: 100vh; }

        /* SIDEBAR */
        .sidebar {
            width: 240px; background: var(--brown); min-height: 100vh;
            position: fixed; left: 0; top: 0;
            display: flex; flex-direction: column; z-index: 100;
        }
        .sidebar-logo {
            padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-logo span {
            font-family: 'Playfair Display', serif; font-size: 1.4rem;
            color: white; font-weight: 700;
        }
        .sidebar-logo .plus { color: var(--gold); }
        .sidebar-nav { padding: 20px 0; flex: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 20px; color: rgba(255,255,255,0.7);
            text-decoration: none; font-size: 0.9rem; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(212,175,55,0.15); color: var(--gold);
            border-left: 3px solid var(--gold);
        }
        .nav-item i { width: 20px; text-align: center; }
        .sidebar-footer { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .back-btn { display: block; text-align: center; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.8rem; }
        .back-btn:hover { color: var(--gold); }

        /* MAIN */
        .main { margin-left: 240px; padding: 30px; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;
        }
        .page-header h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--brown); }
        .page-header p { color: #888; font-size: 0.9rem; margin-top: 3px; }
        .header-actions { display: flex; gap: 10px; }
        .btn {
            padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer;
            font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 500;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s;
        }
        .btn-primary { background: var(--brown); color: white; }
        .btn-primary:hover { background: var(--gold); color: var(--brown); }
        .btn-outline { background: white; color: var(--brown); border: 1px solid #ddd; }
        .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; border-radius: 16px; padding: 22px; box-shadow: var(--shadow); border-left: 4px solid var(--gold); }
        .stat-card.accent { border-left-color: var(--brown); }
        .stat-card .label { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--brown); margin: 5px 0; }
        .stat-card .sub { font-size: 0.8rem; color: #aaa; }

        /* FILTER TABS */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-tab {
            padding: 7px 16px; border-radius: 20px; border: none;
            background: white; color: #888; font-size: 0.85rem; cursor: pointer;
            box-shadow: var(--shadow); transition: all 0.2s; font-family: 'Inter', sans-serif;
        }
        .filter-tab.active, .filter-tab:hover { background: var(--brown); color: white; }
        .search-box {
            flex: 1; display: flex; align-items: center; background: white;
            border-radius: 10px; padding: 0 12px; box-shadow: var(--shadow); gap: 8px;
        }
        .search-box input {
            border: none; outline: none; padding: 9px 0; width: 100%;
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
        }
        .search-box i { color: #ccc; font-size: 0.85rem; }

        /* TABLE */
        .table-card { background: white; border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
        .table-card table { width: 100%; border-collapse: collapse; }
        .table-card th {
            background: var(--brown); color: white; padding: 14px 16px;
            text-align: left; font-size: 0.78rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .table-card td { padding: 13px 16px; border-bottom: 1px solid #f5f5f5; font-size: 0.88rem; color: #444; }
        .table-card tr:hover td { background: #fffbf5; }
        .table-card tr:last-child td { border-bottom: none; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 11px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-paid { background: #d4edda; color: #155724; }
        .status-dispatched { background: #cce5ff; color: #004085; }
        .status-delivered { background: #d1e7dd; color: #0f5132; }
        .status-preorder { background: rgba(212,175,55,0.2); color: #9e7c00; }

        .order-ref { font-family: monospace; font-size: 0.8rem; color: #888; }
        .amount-cell { font-weight: 700; color: var(--brown); }

        select.status-select {
            border: 1px solid #eee; border-radius: 8px; padding: 5px 8px;
            font-family: 'Inter', sans-serif; font-size: 0.8rem;
            background: white; cursor: pointer; color: var(--brown);
        }
        select.status-select:focus { outline: none; border-color: var(--gold); }

        .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; display: block; color: #ddd; }
        .error-msg {
            background: #fff3f3; border: 1px solid #ffa0a0; color: #c00;
            padding: 15px 20px; border-radius: 10px; margin: 20px;
        }
        .items-preview { font-size: 0.8rem; color: #666; max-width: 200px; }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <span>AMEN<span class="plus">+</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="admin.html" class="nav-item active">
                <i class="fas fa-box"></i> Orders
            </a>
            <a href="clients.html" class="nav-item">
                <i class="fas fa-users"></i> Clients
            </a>
            <a href="shop.html" class="nav-item">
                <i class="fas fa-store"></i> Shop
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Site</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <div class="page-header">
            <div>
                <h1>Orders Dashboard</h1>
                <p id="lastRefreshed">Loading...</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="exportCSV()"><i class="fas fa-download"></i> Export CSV</button>
                <button class="btn btn-primary" onclick="loadOrders()"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Orders</div>
                <div class="value" id="statTotal">–</div>
                <div class="sub">All time</div>
            </div>
            <div class="stat-card">
                <div class="label">Pending</div>
                <div class="value" id="statPending">–</div>
                <div class="sub">Awaiting fulfilment</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Revenue</div>
                <div class="value" id="statRevenue">–</div>
                <div class="sub">Paid orders</div>
            </div>
            <div class="stat-card accent">
                <div class="label">Pre-Orders</div>
                <div class="value" id="statPreorders">–</div>
                <div class="sub">Drop collection</div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
            <button class="filter-tab" onclick="setFilter('pending', this)">Pending</button>
            <button class="filter-tab" onclick="setFilter('paid', this)">Paid</button>
            <button class="filter-tab" onclick="setFilter('dispatched', this)">Dispatched</button>
            <button class="filter-tab" onclick="setFilter('delivered', this)">Delivered</button>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, phone, or ref..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Orders Table -->
        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Order Ref</th>
                        <th>Customer</th>
                        <th>Phone</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Delivery Zone</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <tr><td colspan="8" class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const API_URL = 'https://amenplus-backend.onrender.com/api';
        let ADMIN_KEY = localStorage.getItem('amenAdminKey') || promptAdminKey();
        let allOrders = [];
        let currentFilter = 'all';

        function promptAdminKey() {
            const key = prompt('🔐 Enter Admin Key:');
            if (key) localStorage.setItem('amenAdminKey', key);
            return key;
        }

        async function loadOrders() {
            try {
                const [ordersRes, statsRes] = await Promise.all([
                    fetch(`${API_URL}/orders`, { headers: { 'x-admin-key': ADMIN_KEY } }),
                    fetch(`${API_URL}/dashboard/stats`, { headers: { 'x-admin-key': ADMIN_KEY } })
                ]);

                if (ordersRes.status === 401) {
                    document.getElementById('ordersBody').innerHTML = `
                        <tr><td colspan="8" class="error-msg">❌ Invalid Admin Key. <a href="#" onclick="localStorage.removeItem('amenAdminKey'); location.reload()">Try again</a></td></tr>
                    `;
                    return;
                }

                const ordersData = await ordersRes.json();
                const statsData = await statsRes.json();

                if (statsData.success) {
                    const s = statsData.stats;
                    document.getElementById('statTotal').textContent = s.totalOrders;
                    document.getElementById('statPending').textContent = s.pendingOrders;
                    document.getElementById('statRevenue').textContent = `₵${(s.totalRevenue || 0).toLocaleString()}`;
                    document.getElementById('statPreorders').textContent = s.preOrders || 0;
                }

                if (ordersData.success) {
                    allOrders = ordersData.orders;
                    applyFilters();
                }

                document.getElementById('lastRefreshed').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (err) {
                document.getElementById('ordersBody').innerHTML = `
                    <tr><td colspan="8">
                        <div class="error-msg">
                            ⚠️ Cannot connect to backend server.<br>
                            Make sure Render backend is deployed at: <strong>${API_URL}</strong>
                        </div>
                    </td></tr>
                `;
            }
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const q = (document.getElementById('searchInput').value || '').toLowerCase();
            let filtered = allOrders;

            if (currentFilter !== 'all') {
                filtered = filtered.filter(o => o.status === currentFilter);
            }

            if (q) {
                filtered = filtered.filter(o =>
                    (o.customerName || '').toLowerCase().includes(q) ||
                    (o.customerPhone || '').toLowerCase().includes(q) ||
                    (o.reference || '').toLowerCase().includes(q)
                );
            }

            renderOrders(filtered);
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('ordersBody');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="8">
                        <div class="empty-state">
                            <i class="fas fa-box-open"></i>
                            No orders found. Orders will appear here once customers complete payment.
                        </div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const items = Array.isArray(order.items)
                    ? order.items.map(i => `${i.name} (${i.size || '—'}) x${i.quantity}`).join(', ')
                    : (order.items || '—');
                const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-GB') : '—';
                const statusMap = {
                    pending: 'status-pending', paid: 'status-paid',
                    dispatched: 'status-dispatched', delivered: 'status-delivered'
                };
                const statusClass = statusMap[order.status] || 'status-pending';
                const isPreOrder = order.isPreOrder ? '<span class="status-badge status-preorder" style="margin-left:4px;font-size:0.65rem;">PRE</span>' : '';

                return `
                    <tr>
                        <td class="order-ref">${(order.reference || order._id || '').slice(0, 16)}</td>
                        <td><strong>${order.customerName || '—'}</strong>${isPreOrder}</td>
                        <td>${order.customerPhone || '—'}</td>
                        <td class="items-preview" title="${items}">${items.length > 50 ? items.slice(0,50) + '…' : items}</td>
                        <td class="amount-cell">₵${(order.totalAmount || 0).toLocaleString()}</td>
                        <td>${order.deliveryArea || order.deliveryZone || '—'}</td>
                        <td>
                            <select class="status-select" onchange="updateStatus('${order._id}', this.value)">
                                <option value="pending" ${order.status==='pending'?'selected':''}>⏳ Pending</option>
                                <option value="paid" ${order.status==='paid'?'selected':''}>✅ Paid</option>
                                <option value="dispatched" ${order.status==='dispatched'?'selected':''}>🚚 Dispatched</option>
                                <option value="delivered" ${order.status==='delivered'?'selected':''}>📦 Delivered</option>
                            </select>
                        </td>
                        <td>${date}</td>
                    </tr>
                `;
            }).join('');
        }

        async function updateStatus(orderId, newStatus) {
            try {
                const res = await fetch(`${API_URL}/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-key': ADMIN_KEY
                    },
                    body: JSON.stringify({ status: newStatus })
                });
                const data = await res.json();
                if (data.success) {
                    const order = allOrders.find(o => o._id === orderId);
                    if (order) order.status = newStatus;
                    console.log(`✅ Order ${orderId} updated to ${newStatus}`);
                }
            } catch (err) {
                console.error('Error updating status:', err);
            }
        }

        function exportCSV() {
            if (!allOrders.length) { alert('No orders to export yet!'); return; }
            const headers = ['Reference', 'Customer Name', 'Phone', 'Email', 'Total (₵)', 'Delivery Zone', 'Status', 'Pre-Order', 'Date'];
            const rows = allOrders.map(o => [
                o.reference || o._id, o.customerName || '', o.customerPhone || '',
                o.customerEmail || '', o.totalAmount || 0, o.deliveryZone || o.deliveryArea || '',
                o.status, o.isPreOrder ? 'Yes' : 'No',
                o.createdAt ? new Date(o.createdAt).toLocaleDateString() : ''
            ]);
            const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `amenplus_orders_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        loadOrders();
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
