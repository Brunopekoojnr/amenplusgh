# render.yaml - Render.com deployment config for Amen+ Backend
# NOTE: Render automatically provisions a free TLS/SSL certificate for every
#       web service and custom domain — no extra configuration needed.
#       The HTTPS redirect is enforced in server.js via x-forwarded-proto.
services:
  - type: web
    name: amenplus-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: ARKESEL_SENDER_ID
        value: AmenPlus
      - key: MOMO_NUMBER
        value: "+23355098093"
      - key: ALLOWED_ORIGINS
        value: "https://www.amenplusgh.com,https://amenplusgh.com"
